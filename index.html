<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PumpConnect İndirme Merkezi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1b2a; /* Sayfa Arka Planı: Koyu Lacivert */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff; /* Ortadaki Alan Aynen Beyaz */
            width: 100%;
            max-width: 420px;
            padding: 30px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 22px;
            color: #0d2c54;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 28px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-ios {
            background-color: #000000;
            color: #ffffff;
        }

        .btn-android {
            background-color: #01875f;
            color: #ffffff;
        }

        .btn-pdf {
            background-color: #d9381e;
            color: #ffffff;
        }

        .btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- GitHub'a Yüklediğiniz logo.png Dosyası -->
        <img src="logo.png" alt="Gresan Logo" class="logo">

        <h1>PumpConnect</h1>
        <p class="subtitle">Mobil İndirme ve Dokümantasyon Portalı</p>

        <div class="btn-group">
            <!-- iOS App Store Button -->

            <!-- Android Google Play Button -->

                <svg viewBox="0 0 512 512"><path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l220.7-221.3 60.1 60.1L104.6 499z"/></svg>

                <svg viewBox="0 0 384 512"><path d="M181.9 256.1c-5-16-4.9-46.9-2-63.2 15.8-86.2 133.7-64.1 120.4 20-3.3 20.8-19.6 43.1-40.8 59.9 22.8 45.7 41.3 93.3 58.7 139.7 16 42.6-32.8 77.9-66.9 44-18.4-18.3-33-40.4-48.4-62.9-22.1 10.3-46.2 18.5-70.5 23.9-33.8 7.5-68.8-18.8-54.8-51.8 11.2-26.3 43-42.3 75.3-51.5 9.7-20 20.6-39.2 29-58.2zm11.7 101.8c12.2 17.5 23.8 35.2 37.9 51 9-9.5 4.1-26.2-3.1-36.2-10.4-14.4-22.2-28-34.8-41.8-10.1 8.9-20.2 18-30.2 27 10.1 0 20.2 0 30.2 0z"/></svg>

        </div>

        <div class="footer">
            &copy; Gresan Lubrication Solutions
        </div>
    </div>

</body>
</html>
